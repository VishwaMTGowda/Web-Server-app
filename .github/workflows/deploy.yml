name: Deploy Static HTML to EC2

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  # ------------------------------
  # Step 1: Validate on Pull Request
  # ------------------------------
  validate:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Validate HTML Exists
        run: |
          if [ ! -d "./html" ]; then
            echo "❌ Error: HTML folder not found!"
            exit 1
          fi
          echo "✔ Validation passed: HTML folder exists."

  # ------------------------------
  # Step 2: Deploy on Push to Main
  # ------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Rsync
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Deploy to EC2 using Rsync
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > private_key.pem
          chmod 600 private_key.pem

          rsync -avz -e "ssh -i private_key.pem -o StrictHostKeyChecking=no" \
            ./html/ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/html/

      - name: Restart Apache on EC2
        run: |
          ssh -i private_key.pem -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "sudo systemctl restart httpd || sudo systemctl restart apache2"
